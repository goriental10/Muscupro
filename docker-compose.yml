services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: muscupro
      POSTGRES_PASSWORD: muscupro
      POSTGRES_DB: muscupro
    ports:
      - "5432:5432"
    volumes:
      - muscupro_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muscupro -d muscupro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  muscupro_pg:
