name: Repair repository tree

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repair-tree.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore structured source tree
        shell: bash
        run: |
          mkdir -p /tmp/muscupro-source
          unzip -q muscupro-source-tree.zip -d /tmp/muscupro-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/muscupro-source/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore MuscuPro monorepo structure"
          git push
